<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>標籤管理</title>
<script>
/* Apply the saved theme before CSS paints to avoid a flash */
/* 日夜模式：16:00–04:00 為夜間，其餘為白天；手動切換只維持到下一個時段界線 */
(function(){
  function scheduled(d){var h=d.getHours();return (h>=16||h<4)?'dark':'light';}
  function nextBoundary(d){
    var n=new Date(d.getTime());n.setSeconds(0,0);
    var h=d.getHours();
    if(h<4){n.setHours(4,0,0,0);}
    else if(h<16){n.setHours(16,0,0,0);}
    else{n.setDate(n.getDate()+1);n.setHours(4,0,0,0);}
    return n.getTime();
  }
  function effective(now){
    try{var o=JSON.parse(localStorage.getItem('lm_theme_override')||'null');
      if(o&&(o.theme==='light'||o.theme==='dark')&&now<o.until)return o.theme;}catch(e){}
    return scheduled(new Date(now));
  }
  window.lmTheme={scheduled:scheduled,nextBoundary:nextBoundary,effective:effective};
  document.documentElement.setAttribute('data-theme',effective(Date.now()));
})();
</script>
<style>
/* ---------- 色彩 Tokens ---------- */
:root{
  --bg:#F2F2F7;
  --surface:#FFFFFF;
  --surface-2:#F7F7FA;
  --label:#1C1C1E;
  --label-2:rgba(60,60,67,.62);
  --label-3:rgba(60,60,67,.32);
  --separator:rgba(60,60,67,.14);
  --fill:rgba(118,118,128,.10);
  --blue:#007AFF;
  --blue-d:#0062CC;
  --green:#34C759;  --green-d:#248A3D;
  --yellow:#FF9500; --yellow-d:#D67A00;
  --red:#FF3B30;    --red-d:#D7261E;
  --overlay:rgba(0,0,0,.25);
  --glass:rgba(255,255,255,.75);
  --radius-lg:16px;
  --radius-md:12px;
  --radius-sm:8px;
  --shadow-lift:0 12px 32px rgba(0,0,0,.12);
  --day:1;--night:0;
  --sky-top:rgba(90,200,250,.22);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1C1E;
    --surface:#2C2C2E;
    --surface-2:#242426;
    --label:#F2F2F7;
    --label-2:rgba(235,235,245,.62);
    --label-3:rgba(235,235,245,.30);
    --separator:rgba(84,84,88,.65);
    --fill:rgba(120,120,128,.24);
    --overlay:rgba(0,0,0,.4);
    --glass:rgba(44,44,46,.72);
    --shadow-lift:0 12px 32px rgba(0,0,0,.48);
    --day:0;--night:1;
    --sky-top:rgba(88,86,214,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1C1E;
  --surface:#2C2C2E;
  --surface-2:#242426;
  --label:#F2F2F7;
  --label-2:rgba(235,235,245,.62);
  --label-3:rgba(235,235,245,.30);
  --separator:rgba(84,84,88,.65);
  --fill:rgba(120,120,128,.24);
  --overlay:rgba(0,0,0,.4);
  --glass:rgba(44,44,46,.72);
  --shadow-lift:0 12px 32px rgba(0,0,0,.48);
  --day:0;--night:1;
  --sky-top:rgba(88,86,214,.28);
  color-scheme:dark;
}

/* ---------- 基礎 ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;
  font-size:16px;line-height:1.5;color:var(--label);
  -webkit-font-smoothing:antialiased;min-height:100vh;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.hidden{display:none!important}
.busy button{pointer-events:none;opacity:.6}
.ico{width:20px;height:20px;flex:none;display:block}
.tabular{font-variant-numeric:tabular-nums}

/* ---------- 頂部 ---------- */
.topbar{
  position:sticky;top:0;z-index:50;background:var(--bg);
  border-bottom:.5px solid var(--separator);
  padding-top:env(safe-area-inset-top,0px);
}
.bar{max-width:1120px;margin:0 auto;padding:16px max(24px,env(safe-area-inset-right,0px)) 16px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.brand .ico{color:var(--blue);width:28px;height:28px}
.brand h1{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.4px}
.proto{display:block;font-size:13px;color:var(--label-2);margin-top:2px}
.date{font-size:13px;font-weight:500;color:var(--label-2);background:var(--fill);padding:4px 10px;border-radius:var(--radius-sm);white-space:nowrap}
.title-tools{display:flex;align-items:center;gap:12px}

/* ---------- 日夜情境（純裝飾） ---------- */
.bar{position:relative;z-index:1}
.sky{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:0;
  background:linear-gradient(180deg,var(--sky-top) 0%,transparent 78%);
  transition:background .5s ease;
}
.sky > *{position:absolute;transition:opacity .6s ease,transform .8s cubic-bezier(.34,1.3,.64,1)}
.sky .sun{
  top:-26px;right:18%;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle,#FFD60A 0 34%,rgba(255,214,10,.35) 35% 52%,rgba(255,204,0,0) 70%);
  opacity:calc(var(--day) * .9);transform:translateY(calc(var(--night) * 40px));
}
.sky .cloud{
  height:18px;border-radius:999px;background:#fff;
  opacity:calc(var(--day) * .85);transform:translateX(calc(var(--night) * -30px));
  box-shadow:0 2px 6px rgba(0,122,255,.08);
}
.sky .cloud::before,.sky .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.sky .cloud::before{width:22px;height:22px;left:10px;top:-11px}
.sky .cloud::after{width:16px;height:16px;left:26px;top:-7px}
.sky .c1{top:30px;right:calc(18% + 64px);width:56px}
.sky .c2{top:14px;right:calc(18% - 50px);width:44px;transform:translateX(calc(var(--night) * 30px)) scale(.8)}
.sky .moon{
  top:10px;right:18%;width:34px;height:34px;border-radius:50%;
  box-shadow:inset -9px -3px 0 0 #F5F3CE;filter:drop-shadow(0 0 8px rgba(245,243,206,.45));
  opacity:var(--night);transform:translateY(calc(var(--day) * -40px)) rotate(-18deg);
}
.sky .star{width:3px;height:3px;border-radius:50%;background:#fff;opacity:var(--night)}
.sky .star.twinkle{animation:twinkle 2.6s ease-in-out infinite}
.sky .s1{top:12px;right:30%}
.sky .s2{top:34px;right:26%;animation-delay:.6s}
.sky .s3{top:8px;right:11%;animation-delay:1.2s}
.sky .s4{top:44px;right:13%;width:2px;height:2px}
.sky .s5{top:22px;right:38%;width:2px;height:2px;animation-delay:1.8s}
.sky .s6{top:50px;right:34%;width:2px;height:2px}
@keyframes twinkle{0%,100%{opacity:calc(var(--night) * 1)}50%{opacity:calc(var(--night) * .25)}}

/* ---------- 日夜切換開關（iOS Switch） ---------- */
.theme-switch{
  --w:62px;--h:32px;--pad:2px;--knob:28px;
  position:relative;flex:none;width:var(--w);height:var(--h);border-radius:999px;
  padding:0;touch-action:none;user-select:none;-webkit-user-select:none;
  background:linear-gradient(135deg,#64D2FF,#0A84FF);
  box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08);
  transition:background .35s ease;overflow:hidden;
}
.theme-switch[aria-checked="true"]{background:linear-gradient(135deg,#1C1C3C,#3A3A8C)}
.busy .theme-switch{pointer-events:auto;opacity:1}
.ts-deco{position:absolute;inset:0;pointer-events:none}
.ts-deco i{position:absolute;display:block;transition:opacity .35s ease,transform .45s cubic-bezier(.34,1.3,.64,1)}
.ts-cloud{height:7px;border-radius:999px;background:#fff;opacity:.95}
.ts-cloud.a{width:16px;right:8px;top:9px}
.ts-cloud.b{width:12px;right:14px;top:18px;opacity:.8}
.ts-star{width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;transform:translateY(6px)}
.ts-star.a{left:10px;top:9px}
.ts-star.b{left:18px;top:19px;width:3px;height:3px}
.ts-star.c{left:26px;top:8px}
.theme-switch[aria-checked="true"] .ts-cloud{opacity:0;transform:translateY(-6px)}
.theme-switch[aria-checked="true"] .ts-star{opacity:1;transform:none}
.ts-knob{
  --x:0px;
  position:absolute;top:var(--pad);left:var(--pad);
  width:var(--knob);height:var(--knob);border-radius:999px;
  background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);
  display:grid;place-items:center;
  transform:translateX(var(--knob-x,var(--x)));
  transition:transform .35s cubic-bezier(.34,1.4,.64,1),width .2s ease,background .35s ease;
}
.theme-switch[aria-checked="true"] .ts-knob{--x:calc(var(--w) - var(--knob) - var(--pad) * 2);background:#E5E5EA}
.theme-switch.pressed .ts-knob{width:calc(var(--knob) + 6px)}
.theme-switch.pressed[aria-checked="true"]:not(.dragging) .ts-knob{--x:calc(var(--w) - var(--knob) - 6px - var(--pad) * 2)}
.theme-switch.dragging .ts-knob{transition:width .2s ease,background .35s ease}
.ts-knob svg{position:absolute;width:18px;height:18px;transition:opacity .3s ease,transform .45s cubic-bezier(.34,1.3,.64,1)}
.ts-sun{color:#FF9F0A}
.ts-moon{color:#5E5CE6;opacity:0;transform:rotate(-90deg) scale(.5)}
.theme-switch[aria-checked="true"] .ts-sun{opacity:0;transform:rotate(90deg) scale(.5)}
.theme-switch[aria-checked="true"] .ts-moon{opacity:1;transform:none}
.theme-switch:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:999px}

.counts{
  display:grid;grid-template-columns:repeat(3,1fr);
  background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;
}
.count{padding:12px 16px;display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.count + .count{border-left:.5px solid var(--separator)}
.count-num{font-size:28px;line-height:34px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.count-label{font-size:13px;color:var(--label-2)}
.count-num.green{color:var(--green-d)}
.count-num.yellow{color:var(--yellow-d)}
.count-num.red{color:var(--red-d)}

/* ---------- 主區 ---------- */
main{max-width:1120px;margin:0 auto;padding:24px max(24px,env(safe-area-inset-right,0px)) 64px max(24px,env(safe-area-inset-left,0px))}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:18px;color:var(--label-2);margin-bottom:24px}
.hint .ico{width:16px;height:16px;margin-top:1px}

#shelves{display:flex;flex-direction:column;gap:24px}
.empty{font-size:15px;color:var(--label-2);text-align:center;padding:48px 0}

/* 層架 */
.shelf{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;min-width:0}
.shelf-head{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;border-bottom:.5px solid var(--separator);
}
.shelf-title{display:flex;align-items:baseline;gap:12px;min-width:0;flex-wrap:wrap}
.shelf-name{
  font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--label);
  background:transparent;border:0;border-bottom:1px solid transparent;border-radius:0;
  padding:4px 0;width:240px;max-width:100%;
}
.shelf-name:hover{border-bottom-color:var(--separator)}
.shelf-name:focus{border-bottom-color:var(--blue);outline:none}
.muted{font-size:13px;color:var(--label-2)}
.shelf-handle{
  width:32px;height:32px;display:grid;place-items:center;border-radius:var(--radius-sm);
  color:var(--label-2);cursor:grab;flex:none;
}
.shelf-handle:hover{background:var(--fill);color:var(--label)}
.shelf-handle:active{cursor:grabbing}
.shelf-handle .ico{width:20px;height:20px}
.shelf.dragging{opacity:.4}

.rack{
  padding:16px;display:flex;flex-wrap:wrap;gap:16px;min-height:188px;align-items:stretch;
  transition:background .2s ease;border-radius:0;
}
.rack.over{background:rgba(0,122,255,.06)}

/* 分頁 */
.pages{display:flex;align-items:center;gap:8px;margin:0 0 16px;overflow-x:auto;scrollbar-width:none}
.pages::-webkit-scrollbar{display:none}
.page-tab{
  flex:none;padding:6px 14px;border-radius:999px;background:var(--fill);
  color:var(--label-2);font-size:15px;font-weight:500;white-space:nowrap;
  transition:background .2s ease,color .2s ease,box-shadow .2s ease;
  cursor:pointer;user-select:none;
}
.page-tab[aria-selected="true"]{background:var(--surface);color:var(--label);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.page-add{
  flex:none;padding:6px 14px;border-radius:999px;
  color:var(--blue);font-size:18px;font-weight:600;white-space:nowrap;
  background:var(--fill);transition:background .2s ease;
}
.page-add:hover{background:rgba(0,122,255,.12)}
.del-page-btn{width:100%;padding:14px 20px;text-align:center;color:var(--red);font-size:17px;font-weight:500;cursor:pointer}
.del-page-btn:hover{opacity:.75}
.del-page-btn:disabled{opacity:.35;cursor:not-allowed}

/* 品項卡 */
.item-card{
  position:relative;
  width:200px;height:220px;max-width:100%;
  background:var(--surface);border:1.5px solid var(--separator);border-radius:var(--radius-md);
  overflow:hidden;display:flex;flex-direction:column;
  cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  transition:opacity .2s ease,border-color .2s ease;
}
.item-card:hover{border-color:var(--label-3)}
.item-card:active{cursor:grabbing}
.item-card.dragging{opacity:.4}
.item-card.green{border-color:rgba(52,199,89,.5)}
.item-card.yellow{border-color:rgba(255,149,0,.55)}
.item-card.red{border-color:rgba(255,59,48,.55)}

.ic-band{
  flex:0 0 30%;background:#000;color:#fff;
  display:flex;align-items:center;gap:8px;padding:0 4px 0 12px;min-width:0;
}
.ic-name{flex:1;min-width:0;font-size:16px;font-weight:600;line-height:1.3;white-space:nowrap;overflow:hidden}
.ic-label{font-size:13px;font-weight:500;opacity:.7}
.ic-spec{font-size:12px;font-weight:500;color:#8E8E93;white-space:nowrap}
.ic-x{
  width:28px;height:28px;display:grid;place-items:center;border-radius:50%;
  color:#fff;opacity:.6;flex:none;
}
.ic-x:hover{opacity:1;background:rgba(255,255,255,.14)}
.ic-x .ico{width:16px;height:16px}

.ic-body{flex:1;padding:12px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;min-height:0}
.ic-dates{display:flex;flex-direction:column;gap:4px}
.ic-dates div{display:flex;align-items:baseline;gap:8px;font-size:13px;line-height:18px}
.ic-dates span{width:60px;flex:none;color:var(--label-2);white-space:nowrap}
.ic-dates b{font-weight:500;font-variant-numeric:tabular-nums;color:var(--label)}

.ic-foot{font-size:13px;font-weight:600;line-height:18px}
.ic-status.green{color:var(--green-d)}
.ic-status.yellow{color:var(--yellow-d)}
.ic-status.red{color:var(--red-d)}

.retag{
  width:100%;height:32px;border-radius:var(--radius-sm);
  background:var(--blue);color:#fff;font-size:15px;font-weight:600;
  transition:transform .15s ease,opacity .15s ease;
}
.retag:hover{background:var(--blue-d)}
.retag:active,.add-item:active,.add-shelf:active,.alert-btn:active,.text-btn:active{transform:scale(.97);opacity:.75}

.add-item{
  width:130px;height:220px;flex:none;
  border:1px dashed var(--label-3);border-radius:var(--radius-md);
  color:var(--blue);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  font-size:15px;font-weight:500;
  transition:transform .15s ease,background .2s ease;
  cursor:pointer;
}
.add-item:hover{background:rgba(0,122,255,.06)}

.add-shelf{
  width:100%;margin-top:24px;padding:16px;
  display:flex;align-items:center;justify-content:center;gap:8px;
  background:var(--surface);border-radius:var(--radius-lg);
  color:var(--blue);font-size:17px;font-weight:600;
  transition:transform .15s ease,opacity .15s ease;
}
.add-shelf:hover{background:var(--surface-2)}

/* 拖曳 */
.slot{
  flex:none;border:1.5px dashed var(--label-3);border-radius:var(--radius-md);
  background:rgba(120,120,128,.08);
}
#drag-layer{position:fixed;inset:0;pointer-events:none;z-index:1500}
body.is-dragging,body.is-dragging *{user-select:none;-webkit-user-select:none;cursor:grabbing!important}
.lifted{
  position:fixed;left:0;top:0;margin:0;z-index:1500;
  transform-origin:0 0;pointer-events:none;
  box-shadow:0 22px 44px rgba(0,0,0,.28),0 6px 14px rgba(0,0,0,.18);
  transition:none;
}

/* 彈窗 */
.modal{
  position:fixed;inset:0;background:var(--overlay);
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  display:flex;align-items:flex-end;justify-content:center;z-index:1000;
  animation:fadeIn .25s ease-out;
}
.modal.closing{animation:fadeOut .2s ease-in forwards}
.sheet,.alert{
  background:var(--glass);
  backdrop-filter:blur(25px) saturate(180%);-webkit-backdrop-filter:blur(25px) saturate(180%);
  border:.5px solid rgba(255,255,255,.35);
  box-shadow:0 10px 36px rgba(0,0,0,.16);
  animation:modalIn .3s cubic-bezier(.34,1.3,.64,1);
}
.modal.closing .sheet,.modal.closing .alert{animation:modalOut .2s ease-in forwards}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
@keyframes modalIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
@keyframes modalOut{from{opacity:1;transform:none}to{opacity:0;transform:scale(.96)}}
.sheet{
  width:100%;max-width:520px;
  border-radius:20px 20px 0 0;
  padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden;
}
.sheet-bar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:12px 16px;background:transparent;border-bottom:.5px solid var(--separator);
}
.sheet-bar h3{font-size:17px;font-weight:600;text-align:center}
.sheet-bar .text-btn:last-child{justify-self:end}
.text-btn{font-size:17px;color:var(--blue);padding:4px 0;border-radius:6px}
.text-btn.strong{font-weight:600}
.sheet-body{padding:16px;display:flex;flex-direction:column;gap:8px}
.group{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden}
.field + .field{border-top:.5px solid var(--separator)}
.row{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:48px}
.row label{font-size:16px;color:var(--label);white-space:nowrap;flex:none}
.row input[type="text"],.row input[type="date"],.row input:not([type]){
  flex:1;min-width:0;border:0;background:transparent;font-size:16px;text-align:right;
  padding:12px 0;outline:none;color:var(--label);
}
.row input::placeholder{color:var(--label-3)}
.row input:focus{color:var(--label)}
.field:focus-within .row label{color:var(--blue)}
.unit{font-size:16px;color:var(--label-2);flex:none}
.err{display:block;font-size:13px;line-height:18px;color:var(--red-d);padding:0 16px 8px}
.err:empty{display:none}
.field.invalid .row input{color:var(--red-d)}
.hint-row{padding:8px 16px 0;font-size:13px;color:var(--label-2)}

/* Stepper 增減按鈕 */
.stepper{display:flex;align-items:center;gap:4px;flex:1;justify-content:flex-end}
.stepper-btn{
  width:32px;height:32px;border-radius:var(--radius-sm);flex:none;
  color:var(--blue);font-size:20px;font-weight:400;line-height:1;
  background:var(--fill);
  transition:background .15s ease,transform .1s ease;
  display:grid;place-items:center;
}
.stepper-btn:hover{background:rgba(0,122,255,.15)}
.stepper-btn:active{transform:scale(.88)}
.stepper-input{
  width:3.5em;border:0;background:transparent;font-size:16px;text-align:center;
  outline:none;color:var(--label);padding:0;flex:none;
}
.busy .stepper-btn{pointer-events:none;opacity:.6}

/* 確認視窗 */
#ask{align-items:center;padding:16px}
.alert{min-width:270px;max-width:calc(100vw - 32px);border-radius:20px;overflow:hidden;text-align:center}
.alert-msg{padding:20px 16px;font-size:15px;line-height:1.4;white-space:nowrap;overflow:hidden;font-weight:600}
.alert-actions{display:grid;grid-template-columns:1fr 1fr;border-top:.5px solid var(--separator)}
.alert-btn{padding:12px 0;font-size:17px;color:var(--blue)}
.alert-btn + .alert-btn{border-left:.5px solid var(--separator)}
.alert-btn.strong{font-weight:600}
.alert-btn.destructive{color:var(--red-d)}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));
  transform:translateX(-50%);
  background:rgba(28,28,30,.92);color:#fff;
  padding:10px 16px;border-radius:var(--radius-md);
  font-size:15px;font-weight:500;line-height:1.4;text-align:center;
  max-width:calc(100vw - 32px);box-shadow:var(--shadow-lift);z-index:2000;
  transition:opacity .2s ease,transform .2s ease;
}
.toast.success{background:rgba(36,138,61,.94)}
.toast.error{background:rgba(215,38,30,.94)}
.toast.hidden{opacity:0;transform:translate(-50%,8px);pointer-events:none;display:block!important}

/* 桌面版 */
@media (min-width:640px){
  .modal{align-items:center;padding:24px}
  .sheet{border-radius:20px}
  .brand h1{font-size:34px;line-height:40px}
  .count-num{font-size:34px;line-height:40px}
}

/* 手機版 */
@media (max-width:600px){
  .bar{padding:12px 16px}
  main{padding:16px 16px 48px}
  .brand h1{font-size:24px;line-height:30px}
  .count{padding:12px}
  .count-num{font-size:24px;line-height:30px}
  .count-label{font-size:12px}
  .shelf-title{flex:1;min-width:0;flex-wrap:nowrap}
  .shelf-name{width:auto;flex:1;min-width:0}
  .shelf-head{flex-wrap:nowrap}
  .item-card{width:100%}
  .add-item{width:100%;height:auto;min-height:64px;flex-direction:row}
  .rack{padding:12px;gap:12px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header class="topbar">
  <div class="sky" aria-hidden="true">
    <i class="sun"></i><i class="cloud c1"></i><i class="cloud c2"></i>
    <i class="moon"></i>
    <i class="star twinkle s1"></i><i class="star twinkle s2"></i><i class="star twinkle s3"></i>
    <i class="star s4"></i><i class="star twinkle s5"></i><i class="star s6"></i>
  </div>
  <div class="bar">
    <div class="title-row">
      <div>
        <div class="brand">
          <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
          <h1>標籤管理</h1>
        </div>
        <span class="proto">原型：資料儲存於後端，分頁設定存於本機</span>
      </div>
      <div class="title-tools">
        <div class="date" id="today"></div>
        <button type="button" class="theme-switch" id="theme-switch" role="switch" aria-checked="false" aria-label="夜間模式">
          <span class="ts-deco" aria-hidden="true">
            <i class="ts-cloud a"></i><i class="ts-cloud b"></i>
            <i class="ts-star a"></i><i class="ts-star b"></i><i class="ts-star c"></i>
          </span>
          <span class="ts-knob" aria-hidden="true">
            <svg class="ts-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="currentColor"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
            <svg class="ts-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
          </span>
        </button>
      </div>
    </div>
    <div class="counts" role="group" aria-label="狀態統計">
      <div class="count"><span class="count-num green tabular" id="cnt-green">0</span><span class="count-label">安全</span></div>
      <div class="count"><span class="count-num yellow tabular" id="cnt-yellow">0</span><span class="count-label">即將到期</span></div>
      <div class="count"><span class="count-num red tabular" id="cnt-red">0</span><span class="count-label">即將／已過期</span></div>
    </div>
  </div>
</header>

<main>
  <p class="hint">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
    <span>拖曳品項可移動到其他層架；拖曳 ☰ 可調整層架順序；點擊 ☰ 可刪除層架（需先清空）；點擊分頁標籤可改名。</span>
  </p>
  <nav class="pages" id="pages" aria-label="頁面"></nav>
  <div id="shelves"></div>
  <button id="btn-add-shelf" class="add-shelf" type="button">
    <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    <span>新增層架</span>
  </button>
</main>

<!-- 分頁設定 -->
<div id="page-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="page-modal-title">
  <div class="sheet">
    <div class="sheet-bar">
      <button type="button" class="text-btn" id="page-modal-cancel">取消</button>
      <h3 id="page-modal-title">分頁設定</h3>
      <button type="button" class="text-btn strong" id="page-modal-save">儲存</button>
    </div>
    <div class="sheet-body">
      <div class="group">
        <div class="field">
          <div class="row">
            <label for="page-name-input">分頁名稱</label>
            <input id="page-name-input" maxlength="10" placeholder="分頁名稱" autocomplete="off">
          </div>
          <small class="err" id="e-page"></small>
        </div>
      </div>
      <div class="group" id="page-delete-group">
        <button type="button" class="del-page-btn" id="page-delete-btn">刪除此分頁</button>
        <small id="page-delete-err" class="err"></small>
      </div>
    </div>
  </div>
</div>

<!-- 新增層架 -->
<div id="shelf-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="shelf-title">
  <div class="sheet">
    <div class="sheet-bar">
      <button type="button" class="text-btn" data-close-shelf>取消</button>
      <h3 id="shelf-title">新增層架</h3>
      <button type="submit" form="shelf-form" class="text-btn strong">建立</button>
    </div>
    <form id="shelf-form" class="sheet-body" novalidate>
      <div class="group">
        <div class="field">
          <div class="row">
            <label for="s-name">將此層架命名為</label>
            <input id="s-name" maxlength="20" placeholder="例如：冷藏上層" autocomplete="off">
          </div>
          <small class="err" id="e-shelf"></small>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- 新增品項 -->
<div id="add" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="sheet">
    <div class="sheet-bar">
      <button type="button" class="text-btn" data-close>取消</button>
      <h3 id="add-title">新增品項</h3>
      <button type="submit" form="add-form" class="text-btn strong">新增</button>
    </div>
    <form id="add-form" class="sheet-body" novalidate>
      <div class="group">
        <div class="field">
          <div class="row">
            <label for="f-name">品名</label>
            <input id="f-name" maxlength="30" placeholder="例如：火腿、BBQ醬" autocomplete="off">
          </div>
          <small class="err" id="e-name"></small>
        </div>
        <div class="field">
          <div class="row">
            <label for="f-date">解凍日期</label>
            <input id="f-date" type="date">
          </div>
        </div>
        <div class="field">
          <div class="row">
            <label for="f-thaw">解凍天數（解）</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" data-dec="f-thaw">−</button>
              <input id="f-thaw" class="stepper-input" type="text" inputmode="numeric" maxlength="3" value="1">
              <button type="button" class="stepper-btn" data-inc="f-thaw">+</button>
              <span class="unit">天</span>
            </div>
          </div>
          <small class="err" id="e-thaw"></small>
        </div>
        <div class="field">
          <div class="row">
            <label for="f-keep">保存天數（放）</label>
            <div class="stepper">
              <button type="button" class="stepper-btn" data-dec="f-keep">−</button>
              <input id="f-keep" class="stepper-input" type="text" inputmode="numeric" maxlength="3" value="2">
              <button type="button" class="stepper-btn" data-inc="f-keep">+</button>
              <span class="unit">天</span>
            </div>
          </div>
          <small class="err" id="e-keep"></small>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- 確認視窗 -->
<div id="ask" class="modal hidden" role="dialog" aria-modal="true">
  <div class="alert">
    <p id="ask-msg" class="alert-msg"></p>
    <div class="alert-actions">
      <button id="ask-cancel" class="alert-btn" type="button">取消</button>
      <button id="ask-ok" class="alert-btn strong" type="button">確定</button>
    </div>
  </div>
</div>

<div id="drag-layer"></div>
<div id="toast" class="toast hidden" role="status"></div>

<script>
(function () {
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const svg = body => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${body}</svg>`;
  const ICON = {
    plus: svg('<path d="M5 12h14"/><path d="M12 5v14"/>'),
    x: svg('<path d="M18 6 6 18"/><path d="m6 6 12 12"/>'),
    handle: svg('<path d="M4 7h16"/><path d="M4 12h16"/><path d="M4 17h16"/>'),
  };

  /* ---- 後端資料 ---- */
  let todayStr = '';
  let shelves = [];
  let items = [];

  async function apiCall(method, url, body = null) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (body !== null) opts.body = JSON.stringify(body);
    const res = await fetch(url, opts);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || err.message || `HTTP ${res.status}`);
    }
    if (res.status === 204 || res.headers.get('content-length') === '0') return null;
    return res.json();
  }

  /* ---- 分頁系統（localStorage） ---- */
  let pages = [];
  let currentPageId = 1;
  let shelfPageMap = {};   // { shelfId(Number): pageId }
  const INIT_PER_PAGE = 4;

  function loadPageState() {
    try {
      const sp = localStorage.getItem('lm_pages');
      if (sp) pages = JSON.parse(sp);
    } catch(e) {}
    if (!pages || !pages.length) pages = [{id:1, name:'1'}, {id:2, name:'2'}];

    try {
      const sm = localStorage.getItem('lm_spm');
      if (sm) shelfPageMap = JSON.parse(sm);
    } catch(e) {}
    if (!shelfPageMap) shelfPageMap = {};

    if (!pages.find(p => p.id === currentPageId)) currentPageId = pages[0].id;
  }

  function savePageState() {
    try {
      localStorage.setItem('lm_pages', JSON.stringify(pages));
      localStorage.setItem('lm_spm', JSON.stringify(shelfPageMap));
    } catch(e) {}
  }

  function assignNewShelves() {
    const isFirstRun = Object.keys(shelfPageMap).length === 0 && shelves.length > 0;
    if (isFirstRun) {
      // 初始分配：按順序分配層架到各分頁
      shelves.forEach((s, idx) => {
        const pi = Math.floor(idx / INIT_PER_PAGE);
        while (pages.length <= pi) {
          const nid = pages.length + 1;
          pages.push({ id: nid, name: String(nid) });
        }
        shelfPageMap[s.id] = pages[pi].id;
      });
    } else {
      // 新建層架指派到當前分頁
      shelves.forEach(s => {
        if (!(s.id in shelfPageMap)) shelfPageMap[s.id] = currentPageId;
      });
    }
    // 清理已刪除的層架
    const idSet = new Set(shelves.map(s => s.id));
    Object.keys(shelfPageMap).forEach(k => {
      if (!idSet.has(Number(k))) delete shelfPageMap[k];
    });
    savePageState();
  }

  async function loadData() {
    try {
      const [shelfData, statusData] = await Promise.all([
        apiCall('GET', '/api/shelves'),
        apiCall('GET', '/api/status/summary'),
      ]);
      todayStr = statusData.today;
      shelves = shelfData;
      items = shelfData.flatMap(s => s.items || []);
      assignNewShelves();
      render();
    } catch (err) {
      toast(`載入失敗：${err.message}`, 'error');
    }
  }

  setInterval(() => loadData(), 60000);

  let busy = false;
  let addShelfId = null;

  /* ---- UI 輔助 ---- */
  let toastTimer = null;
  function toast(msg, type = 'info') {
    const el = $('#toast');
    el.textContent = msg;
    el.className = `toast ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.className = 'toast hidden'; }, 2800);
  }

  async function run(fn) {
    if (busy) return;
    busy = true;
    document.body.classList.add('busy');
    try { await fn(); }
    catch (err) {
      toast(err.message || '操作失敗', 'error');
      busy = false;
      document.body.classList.remove('busy');
      return;
    }
    busy = false;
    document.body.classList.remove('busy');
    await loadData();
  }

  function fitAlert() {
    const el = $('#ask-msg');
    let fs = 15;
    el.style.fontSize = fs + 'px';
    while (el.scrollWidth > el.clientWidth && fs > 11) el.style.fontSize = (--fs) + 'px';
  }

  function showModal(el) {
    clearTimeout(el._hideT);
    el.classList.remove('closing', 'hidden');
    document.body.style.overflow = 'hidden';
  }
  function hideModal(el) {
    if (el.classList.contains('hidden') || el.classList.contains('closing')) return;
    el.classList.add('closing');
    el._hideT = setTimeout(() => {
      el.classList.remove('closing');
      el.classList.add('hidden');
      document.body.style.overflow = '';
    }, 200);
  }

  function ask(msg, okText) {
    return new Promise(resolve => {
      $('#ask-msg').textContent = msg;
      const okBtn = $('#ask-ok'), cancelBtn = $('#ask-cancel');
      okBtn.textContent = okText;
      okBtn.classList.toggle('destructive', okText === '刪除');
      showModal($('#ask'));
      fitAlert();
      okBtn.focus();
      const done = v => { hideModal($('#ask')); okBtn.onclick = null; cancelBtn.onclick = null; resolve(v); };
      okBtn.onclick = () => done(true);
      cancelBtn.onclick = () => done(false);
    });
  }

  /* ---- 分頁渲染 ---- */
  function renderPages() {
    const nav = $('#pages');
    nav.innerHTML = '';

    pages.forEach(p => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'page-tab';
      btn.setAttribute('aria-selected', p.id === currentPageId);
      btn.dataset.pageId = p.id;
      btn.textContent = p.name;
      btn.addEventListener('click', () => {
        if (p.id === currentPageId) {
          openPageModal(p.id);
        } else {
          currentPageId = p.id;
          render();
        }
      });
      nav.appendChild(btn);
    });

    // 新增分頁 +
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'page-add';
    addBtn.textContent = '+';
    addBtn.title = '新增分頁';
    addBtn.addEventListener('click', () => {
      const newId = Date.now();
      pages.push({ id: newId, name: String(pages.length + 1) });
      currentPageId = newId;
      savePageState();
      render();
      openPageModal(newId);
    });
    nav.appendChild(addBtn);
  }

  /* ---- 分頁設定彈窗 ---- */
  function openPageModal(pageId) {
    const p = pages.find(pg => pg.id === pageId);
    if (!p) return;
    const modal = $('#page-modal');
    const inp = $('#page-name-input');
    const err = $('#e-page');
    const delBtn = $('#page-delete-btn');
    const delErr = $('#page-delete-err');
    inp.value = p.name;
    err.textContent = '';
    delErr.textContent = '';
    $('#page-delete-group').style.display = pages.length > 1 ? '' : 'none';
    showModal(modal);
    setTimeout(() => { inp.select(); inp.focus(); }, 10);

    $('#page-modal-save').onclick = () => {
      const v = inp.value.trim();
      if (!v) { err.textContent = '名稱不可為空'; return; }
      p.name = v;
      savePageState();
      closePageModal();
      renderPages();
    };

    delBtn.onclick = async () => {
      delErr.textContent = '';
      const shelfCount = shelves.filter(s => shelfPageMap[s.id] === pageId).length;
      if (shelfCount > 0) {
        delErr.textContent = `此分頁還有 ${shelfCount} 個層架，請先清空才能刪除`;
        return;
      }
      const itemCount = shelves.filter(s => shelfPageMap[s.id] === pageId)
        .reduce((n, s) => n + (s.items?.length || 0), 0);
      if (itemCount > 0) {
        delErr.textContent = `此分頁還有 ${itemCount} 個食品，請先清空才能刪除`;
        return;
      }
      if (!await ask(`確定刪除「${p.name}」分頁？`, '刪除')) return;
      if (!await ask(`刪除後無法復原！確定要永久刪除「${p.name}」嗎？`, '確定刪除')) return;
      pages = pages.filter(pg => pg.id !== pageId);
      if (currentPageId === pageId) currentPageId = pages[0].id;
      savePageState();
      closePageModal();
      render();
    };
  }

  function closePageModal() { hideModal($('#page-modal')); }

  $('#page-modal-cancel').addEventListener('click', closePageModal);
  $('#page-modal').addEventListener('click', e => { if (e.target === $('#page-modal')) closePageModal(); });

  /* ---- 主渲染 ---- */
  function render() {
    if (todayStr) $('#today').textContent = `今天 ${todayStr.slice(5).replace('-', '/')}`;

    const c = { green: 0, yellow: 0, red: 0 };
    items.forEach(it => {
      const key = it.statusColor.toLowerCase();
      if (key in c) c[key]++;
    });
    $('#cnt-green').textContent = c.green;
    $('#cnt-yellow').textContent = c.yellow;
    $('#cnt-red').textContent = c.red;

    renderPages();

    const box = $('#shelves');
    box.innerHTML = '';

    if (shelves.length === 0) {
      box.innerHTML = '<p class="empty">目前沒有層架，請點下方「新增層架」。</p>';
      return;
    }

    const visible = shelves.filter(s => shelfPageMap[s.id] === currentPageId);

    if (visible.length === 0) {
      box.innerHTML = '<p class="empty">此分頁沒有層架，請點下方「新增層架」新增。</p>';
      return;
    }

    visible.forEach(s => {
      const list = items.filter(it => it.shelfId === s.id);
      const sec = document.createElement('section');
      sec.className = 'shelf';
      sec.dataset.shelfId = s.id;
      sec.innerHTML = `
        <div class="shelf-head">
          <div class="shelf-title">
            <input class="shelf-name" maxlength="20" value="${esc(s.name)}" aria-label="層架名稱" title="點擊可改名">
          </div>
          <button type="button" class="shelf-handle" title="拖曳排序；點擊刪除" aria-label="拖曳排序或刪除此層">${ICON.handle}</button>
        </div>
        <div class="rack" data-shelf-id="${s.id}"></div>`;

      const nameIn = sec.querySelector('.shelf-name');
      nameIn.addEventListener('change', () => {
        const v = nameIn.value.trim();
        if (!v) { toast('層架名稱不可為空', 'error'); nameIn.value = s.name; return; }
        run(async () => { await apiCall('PUT', `/api/shelves/${s.id}/name`, { name: v }); });
      });
      nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') nameIn.blur(); });

      const handle = sec.querySelector('.shelf-handle');
      handle.addEventListener('click', async () => {
        if (suppressClick) return;
        if (list.length) { toast(`「${s.name}」仍有 ${list.length} 個品項，請先清空`, 'error'); return; }
        if (!await ask(`確定要刪除「${s.name}」嗎？`, '刪除')) return;
        await run(async () => {
          await apiCall('DELETE', `/api/shelves/${s.id}`);
          toast(`已刪除「${s.name}」`, 'success');
        });
      });

      const rack = sec.querySelector('.rack');
      list.forEach(it => rack.appendChild(itemCard(it)));

      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'add-item';
      addBtn.innerHTML = `${ICON.plus}<span>新增品項</span>`;
      addBtn.addEventListener('click', () => openAdd(s.id, s.name));
      rack.appendChild(addBtn);

      box.appendChild(sec);
    });

    fitNames();
  }

  function fitNames() {
    document.querySelectorAll('.ic-name').forEach(el => {
      let fs = 16;
      el.style.fontSize = fs + 'px';
      while (el.scrollWidth > el.clientWidth && fs > 10) el.style.fontSize = (--fs) + 'px';
    });
  }

  function itemCard(it) {
    const colorClass = it.statusColor.toLowerCase(); // green / yellow / red
    const c = document.createElement('div');
    c.className = `item-card ${colorClass}`;
    c.dataset.id = it.id;
    c.innerHTML = `
      <div class="ic-band">
        <span class="ic-name" title="${esc(it.name)}"><span class="ic-label">品名：</span>${esc(it.name)} <span class="ic-spec">解${it.thawDays}放${it.keepDays}</span></span>
        <button type="button" class="ic-x" title="刪除品項" aria-label="刪除 ${esc(it.name)}">${ICON.x}</button>
      </div>
      <div class="ic-body">
        <div class="ic-dates">
          <div><span>解凍日期</span><b>${it.thawDate.slice(5).replace('-', '/')}</b></div>
          <div><span>使用日期</span><b>${it.openDate.slice(5).replace('-', '/')}</b></div>
          <div><span>丟棄日期</span><b>${it.discardDate.slice(5).replace('-', '/')}</b></div>
        </div>
        <div>
          <button type="button" class="retag">換標</button>
        </div>
        <div class="ic-foot"><span class="ic-status ${colorClass}">${it.statusText}</span></div>
      </div>`;

    c.querySelector('.retag').addEventListener('click', async () => {
      if (!await ask(`將「${it.name}」換標為今天（${todayStr}）？`, '換標')) return;
      await run(async () => {
        await apiCall('PUT', `/api/items/${it.id}/retag`);
        toast(`已完成「${it.name}」換標`, 'success');
      });
    });

    c.querySelector('.ic-x').addEventListener('click', async () => {
      if (!await ask(`確定要刪除品項「${it.name}」嗎？`, '刪除')) return;
      await run(async () => {
        await apiCall('DELETE', `/api/items/${it.id}`);
        toast(`已刪除「${it.name}」`, 'success');
      });
    });

    return c;
  }

  /* ---- 新增品項 ---- */
  function openAdd(shelfId, shelfName) {
    addShelfId = shelfId;
    $('#add-title').textContent = `新增至「${shelfName}」`;
    $('#f-name').value = '';
    $('#f-thaw').value = '1';
    $('#f-keep').value = '2';
    // 預設解凍日期為今天
    if (todayStr) {
      $('#f-date').value = todayStr;
    } else {
      const d = new Date();
      $('#f-date').value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    }
    showErrors({});
    showModal($('#add'));
    setTimeout(() => $('#f-name').focus(), 50);
  }
  function closeAdd() { hideModal($('#add')); }

  function showErrors(errs) {
    $('#e-name').textContent = errs.name || '';
    $('#e-thaw').textContent = errs.thaw || '';
    $('#e-keep').textContent = errs.keep || '';
    $('#f-name').closest('.field').classList.toggle('invalid', !!errs.name);
    $('#f-thaw').closest('.field').classList.toggle('invalid', !!errs.thaw);
    $('#f-keep').closest('.field').classList.toggle('invalid', !!errs.keep);
  }

  /* Stepper 增減按鈕 */
  document.querySelectorAll('[data-inc]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const inp = $(`#${btn.dataset.inc}`);
      const max = btn.dataset.inc === 'f-thaw' ? 30 : 365;
      inp.value = Math.min(max, (parseInt(inp.value) || 0) + 1);
      showErrors({});
    });
  });
  document.querySelectorAll('[data-dec]').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const inp = $(`#${btn.dataset.dec}`);
      inp.value = Math.max(0, (parseInt(inp.value) || 0) - 1);
      showErrors({});
    });
  });

  $('#add-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name  = $('#f-name').value.trim();
    const thawS = $('#f-thaw').value.trim();
    const keepS = $('#f-keep').value.trim();
    const dateV = $('#f-date').value;
    const errs  = {};
    if (!name) errs.name = '請輸入品名';
    else if ([...name].length > 30) errs.name = '品名最多 30 個字';
    if (!/^\d+$/.test(thawS) || +thawS > 30)  errs.thaw = '解凍天數請填 0–30 的整數';
    if (!/^\d+$/.test(keepS) || +keepS > 365) errs.keep = '保存天數請填 0–365 的整數';
    showErrors(errs);
    if (Object.keys(errs).length) return;

    const shelfId = addShelfId;
    closeAdd();
    await run(async () => {
      const payload = { name, thawDays: +thawS, keepDays: +keepS };
      if (dateV) payload.thawDate = dateV;
      await apiCall('POST', `/api/shelves/${shelfId}/items`, payload);
      toast(`已新增「${name}」`, 'success');
    });
  });

  document.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeAdd));
  $('#ask').addEventListener('click', e => { if (e.target.id === 'ask') $('#ask-cancel').click(); });
  $('#add').addEventListener('click', e => { if (e.target.id === 'add') closeAdd(); });
  ['#f-name','#f-thaw','#f-keep'].forEach(sel => $(sel).addEventListener('input', () => showErrors({})));

  /* ---- 新增層架 ---- */
  function openShelfModal() {
    $('#s-name').value = '';
    $('#e-shelf').textContent = '';
    $('#s-name').closest('.field').classList.remove('invalid');
    showModal($('#shelf-modal'));
    setTimeout(() => $('#s-name').focus(), 50);
  }
  function closeShelfModal() { hideModal($('#shelf-modal')); }

  $('#btn-add-shelf').addEventListener('click', openShelfModal);
  document.querySelectorAll('[data-close-shelf]').forEach(b => b.addEventListener('click', closeShelfModal));
  $('#shelf-modal').addEventListener('click', e => { if (e.target.id === 'shelf-modal') closeShelfModal(); });
  $('#s-name').addEventListener('input', () => { $('#e-shelf').textContent = ''; $('#s-name').closest('.field').classList.remove('invalid'); });

  $('#shelf-form').addEventListener('submit', async e => {
    e.preventDefault();
    const name = $('#s-name').value.trim();
    let err = '';
    if (!name) err = '請輸入層架名稱';
    else if ([...name].length > 20) err = '層架名稱最多 20 個字';
    if (err) { $('#e-shelf').textContent = err; $('#s-name').closest('.field').classList.add('invalid'); return; }
    closeShelfModal();
    await run(async () => {
      await apiCall('POST', '/api/shelves', { name });
      toast(`已新增「${name}」`, 'success');
    });
  });

  /* ---- 拖曳系統 ---- */
  const dragLayer = $('#drag-layer');
  const LONG_PRESS_MS = 450;
  const LIFT_SCALE = 1.08;
  const EDGE = 90;
  const MAX_SCROLL = 18;
  let pend = null;
  let drag = null;
  let suppressClick = false;

  function cancelPend() {
    if (pend?.timer) clearTimeout(pend.timer);
    pend = null;
  }

  function layoutBox(el) {
    let x = 0, y = 0, n = el;
    while (n && n !== document.body) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
    return { x, y, w: el.offsetWidth, h: el.offsetHeight };
  }
  function toLayout(cx, cy) {
    const o = document.body.getBoundingClientRect();
    return { x: cx + scrollX - o.left - scrollX, y: cy + scrollY - o.top - scrollY };
  }

  function flip(mutate, sel = '.item-card') {
    const els = [...document.querySelectorAll(`${sel}:not(.lifted):not(.dragging)`)];
    const first = new Map(els.map(c => [c, c.getBoundingClientRect()]));
    mutate();
    els.forEach(c => {
      const a = first.get(c), b = c.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
      c.animate([{ transform:`translate(${dx}px,${dy}px)` },{ transform:'translate(0,0)' }],
        { duration: 260, easing: 'cubic-bezier(.2,.8,.2,1)' });
    });
  }

  function insertPointFor(rack, lx, ly) {
    for (const c of rack.querySelectorAll('.item-card:not(.lifted)')) {
      const b = layoutBox(c);
      if (ly < b.y) return c;
      if (ly <= b.y + b.h && lx < b.x + b.w / 2) return c;
    }
    return rack.querySelector('.add-item');
  }

  function shelfBefore(ly) {
    for (const s of document.querySelectorAll('#shelves > .shelf:not(.lifted)')) {
      const b = layoutBox(s);
      if (ly < b.y + b.h / 2) return s;
    }
    return null;
  }

  // Hysteresis: moving the slot reflows the page, which can put a *stationary* pointer
  // over a different spot and bounce the slot back every frame. After each slot move,
  // require the pointer to travel SLOT_LOCK_PX (page coords, so auto-scroll still counts).
  const SLOT_LOCK_PX = 6;
  function placeSlot(d, container, before, sel) {
    if (d.slot.parentNode === container && d.slot.nextSibling === before) return;
    const lp = toLayout(d.px, d.py);
    if (d.lock && Math.hypot(lp.x - d.lock.x, lp.y - d.lock.y) < SLOT_LOCK_PX) return;
    flip(() => container.insertBefore(d.slot, before), sel);
    d.lock = lp;
  }

  function setOver(d, rack) {
    if (d.overRack === rack) return;
    if (d.overRack) d.overRack.classList.remove('over');
    if (rack) rack.classList.add('over');
    d.overRack = rack;
  }

  function place(d) {
    const lp = toLayout(d.px, d.py);
    if (d.kind === 'shelf') {
      placeSlot(d, $('#shelves'), shelfBefore(lp.y), '.shelf');
      return;
    }
    // 品項拖曳：找游標下方的 rack
    const under = document.elementFromPoint(d.px, d.py);
    const rack = under ? under.closest('.rack') : null;
    if (rack) {
      placeSlot(d, rack, insertPointFor(rack, lp.x, lp.y), '.item-card');
    } else {
      placeSlot(d, d.parent0, d.before0, '.item-card');
    }
    // highlight follows where the slot really is (it may be held by the hysteresis lock)
    const slotRack = d.slot.parentNode;
    setOver(d, rack && slotRack === rack ? rack : (slotRack === d.parent0 && !rack ? null : d.overRack));
  }

  function tick() {
    if (!drag) return;
    drag.raf = requestAnimationFrame(tick);
    let dy = 0;
    if (drag.py < EDGE) dy = -MAX_SCROLL * (EDGE - drag.py) / EDGE;
    else if (drag.py > innerHeight - EDGE) dy = MAX_SCROLL * (drag.py - (innerHeight - EDGE)) / EDGE;
    if (dy) window.scrollBy(0, dy);
    const s = drag.scale;
    drag.el.style.transform = `translate3d(${drag.px - drag.offX*s}px,${drag.py - drag.offY*s}px,0) scale(${s})`;
    place(drag);
  }

  function beginLift(kind, el, x, y, rect) {
    const cs = getComputedStyle(el);
    const parent0 = el.parentNode, before0 = el.nextSibling;
    const slot = document.createElement('div');
    slot.className = 'slot';
    slot.style.width  = rect.width  + 'px';
    slot.style.height = rect.height + 'px';
    if (kind === 'shelf') { slot.style.borderRadius = 'var(--radius-lg)'; slot.style.margin = cs.margin; }
    parent0.insertBefore(slot, el);
    el.style.width  = rect.width  + 'px';
    el.style.height = rect.height + 'px';
    el.style.left   = '0px';
    el.style.top    = '0px';
    el.classList.add('lifted');
    dragLayer.appendChild(el);
    document.body.classList.add('is-dragging');
    drag = {
      kind, el, slot, parent0, before0,
      scale: kind === 'item' ? LIFT_SCALE : 1,
      offX: x - rect.left, offY: y - rect.top,
      px: x, py: y, raf: null, overRack: null,
    };
    tick();
  }

  function endDrag() {
    const d = drag;
    drag = null;
    if (d.raf != null) cancelAnimationFrame(d.raf);
    setOver(d, null);
    document.body.classList.remove('is-dragging');
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 300);

    const r = d.slot.getBoundingClientRect();
    const settle = d.el.animate(
      [{ transform: d.el.style.transform },
       { transform: `translate3d(${r.left}px,${r.top}px,0) scale(1)` }],
      { duration: 320, easing: 'cubic-bezier(.34,1.4,.64,1)' }
    );
    settle.onfinish = () => {
      // 修復：parseInt 將 dataset 字串轉為數字
      const id = parseInt(d.el.dataset.id || d.el.dataset.shelfId);
      const targetShelfId = d.kind === 'item' ? parseInt(d.slot.parentNode.dataset.shelfId) : null;

      let idx = 0;
      if (d.kind === 'item') {
        // 品項：頁面相對索引即可（同層架排序）
        for (let n = d.slot.previousSibling; n; n = n.previousSibling) {
          if (n.classList?.contains('item-card')) idx++;
        }
      } else {
        // 層架：需要轉換為全局索引，因為 #shelves 只顯示當前分頁的層架
        const prevShelfEl = d.slot.previousSibling;
        const nextShelfEl = d.slot.nextSibling;
        if (prevShelfEl?.classList?.contains('shelf')) {
          const prevId = parseInt(prevShelfEl.dataset.shelfId);
          const globalWithoutDragged = shelves.filter(s => s.id !== id);
          const prevGlobalIdx = globalWithoutDragged.findIndex(s => s.id === prevId);
          idx = prevGlobalIdx >= 0 ? prevGlobalIdx + 1 : 0;
        } else {
          // 拖到第一位：找第一個可見層架的全局位置
          if (nextShelfEl?.classList?.contains('shelf')) {
            const nextId = parseInt(nextShelfEl.dataset.shelfId);
            const globalWithoutDragged = shelves.filter(s => s.id !== id);
            const nextGlobalIdx = globalWithoutDragged.findIndex(s => s.id === nextId);
            idx = nextGlobalIdx >= 0 ? nextGlobalIdx : 0;
          } else {
            idx = 0;
          }
        }
      }

      d.el.remove();
      d.slot.remove();

      if (d.kind === 'item') {
        run(async () => {
          await apiCall('PUT', '/api/items/move', { itemId: id, targetShelfId, targetIndex: idx });
        });
      } else {
        run(async () => {
          await apiCall('PUT', '/api/shelves/move', { shelfId: id, targetIndex: idx });
        });
      }
    };
  }

  function onDown(e) {
    if (drag || e.button !== 0) return;
    let kind, el;
    const handle = e.target.closest('.shelf-handle');
    if (handle) {
      kind = 'shelf'; el = handle.closest('.shelf');
    } else {
      if (e.target.closest('button, input, textarea')) return;
      el = e.target.closest('.item-card');
      if (!el) return;
      kind = 'item';
    }
    cancelPend();
    pend = {
      kind, el, id: e.pointerId, type: e.pointerType,
      sx: e.clientX, sy: e.clientY, x: e.clientX, y: e.clientY,
      rect: el.getBoundingClientRect(), timer: null,
    };
    if (e.pointerType !== 'mouse') {
      pend.timer = setTimeout(() => {
        const p = pend; if (!p) return;
        pend = null;
        if (navigator.vibrate) navigator.vibrate(10);
        beginLift(p.kind, p.el, p.x, p.y, p.rect);
      }, LONG_PRESS_MS);
    }
  }

  function onWinMove(e) {
    if (drag) { drag.px = e.clientX; drag.py = e.clientY; return; }
    if (!pend || e.pointerId !== pend.id) return;
    pend.x = e.clientX; pend.y = e.clientY;
    const dist = Math.hypot(e.clientX - pend.sx, e.clientY - pend.sy);
    if (pend.type === 'mouse' && dist > 4) {
      const p = pend; cancelPend(); beginLift(p.kind, p.el, p.x, p.y, p.rect);
    } else if (pend.type !== 'mouse' && dist > 10) {
      cancelPend();
    }
  }

  function onWinUp(e) {
    if (pend && e.pointerId === pend.id) cancelPend();
    if (drag) endDrag();
  }

  const shelvesEl = $('#shelves');
  shelvesEl.addEventListener('pointerdown', onDown);
  shelvesEl.addEventListener('contextmenu', e => {
    if (e.target.closest('.item-card, .shelf-handle')) e.preventDefault();
  });
  window.addEventListener('pointermove', onWinMove);
  window.addEventListener('pointerup', onWinUp);
  window.addEventListener('pointercancel', onWinUp);
  window.addEventListener('touchmove', e => { if (drag) e.preventDefault(); }, { passive: false });

  /* ---- 日夜模式（iOS Switch：點擊 / 拖曳把手 / 鍵盤） ---- */
  const OVERRIDE_KEY = 'lm_theme_override';
  const themeSw = $('#theme-switch');
  try { localStorage.removeItem('lm_theme'); } catch (e) {}   // 舊版設定已不再使用

  // 手動切換的結果只保留到下一個時段界線（04:00 或 16:00），到點自動依時段切換
  function setOverride(theme) {
    try {
      localStorage.setItem(OVERRIDE_KEY, JSON.stringify({ theme, until: lmTheme.nextBoundary(new Date()) }));
    } catch (e) {}
  }
  function clearExpiredOverride() {
    try {
      const raw = localStorage.getItem(OVERRIDE_KEY);
      if (!raw) return;
      const o = JSON.parse(raw);
      if (!(o && Date.now() < o.until)) localStorage.removeItem(OVERRIDE_KEY);
    } catch (e) { try { localStorage.removeItem(OVERRIDE_KEY); } catch (err) {} }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const night = theme === 'dark';
    themeSw.setAttribute('aria-checked', String(night));
    themeSw.title = night ? '夜間模式（點擊或滑動切換為白天）' : '白天模式（點擊或滑動切換為夜間）';
  }
  function currentTheme() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  function manualTheme(theme) { setOverride(theme); applyTheme(theme); }
  function toggleTheme() { manualTheme(currentTheme() === 'dark' ? 'light' : 'dark'); }

  // 依目前時間同步；時段界線到了就自動切換（覆蓋值過期即清除）
  function syncTheme() {
    clearExpiredOverride();
    const want = lmTheme.effective(Date.now());
    if (want !== currentTheme()) applyTheme(want);
  }
  applyTheme(lmTheme.effective(Date.now()));
  setInterval(syncTheme, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncTheme(); });

  let swDrag = null;
  let swSuppressClick = false;
  function swTravel() {
    const knob = themeSw.querySelector('.ts-knob');
    return Math.max(0, themeSw.clientWidth - knob.offsetWidth - 4);
  }
  themeSw.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    swDrag = {
      id: e.pointerId, sx: e.clientX, moved: false,
      start: currentTheme() === 'dark' ? swTravel() : 0, x: 0,
    };
    themeSw.classList.add('pressed');
    try { themeSw.setPointerCapture(e.pointerId); } catch (err) {}
  });
  themeSw.addEventListener('pointermove', e => {
    if (!swDrag || e.pointerId !== swDrag.id) return;
    const dx = e.clientX - swDrag.sx;
    if (!swDrag.moved && Math.abs(dx) <= 3) return;
    swDrag.moved = true;
    themeSw.classList.add('dragging');
    const travel = swTravel();
    swDrag.x = Math.max(0, Math.min(travel, swDrag.start + dx));
    themeSw.style.setProperty('--knob-x', swDrag.x + 'px');
    swDrag.travel = travel;
  });
  function endSwDrag(e, cancelled) {
    if (!swDrag || e.pointerId !== swDrag.id) return;
    const d = swDrag;
    swDrag = null;
    themeSw.classList.remove('pressed', 'dragging');
    themeSw.style.removeProperty('--knob-x');
    if (!d.moved) return;           // plain tap → handled by click
    swSuppressClick = true;
    setTimeout(() => { swSuppressClick = false; }, 400);
    if (cancelled) return;
    const want = d.x > (d.travel || swTravel()) / 2 ? 'dark' : 'light';
    if (want !== currentTheme()) manualTheme(want);
  }
  themeSw.addEventListener('pointerup', e => endSwDrag(e, false));
  themeSw.addEventListener('pointercancel', e => endSwDrag(e, true));
  themeSw.addEventListener('lostpointercapture', e => endSwDrag(e, true));
  themeSw.addEventListener('click', e => {
    if (swSuppressClick) { swSuppressClick = false; e.preventDefault(); return; }
    toggleTheme();
  });

  /* ---- 鍵盤 ---- */
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    if (!$('#ask').classList.contains('hidden')) $('#ask-cancel').click();
    else if (!$('#page-modal').classList.contains('hidden')) closePageModal();
    else if (!$('#shelf-modal').classList.contains('hidden')) closeShelfModal();
    else if (!$('#add').classList.contains('hidden')) closeAdd();
  });

  loadPageState();
  loadData();
})();
</script>
</body>
</html>
